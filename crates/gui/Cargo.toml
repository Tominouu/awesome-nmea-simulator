[package]
name = "nmeasim"
description = "Simulateur NMEA 0183 / Signal K pilotable à la manette, remplaçant de NMEASimulator 1.6.1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "nmeasim"
path = "src/main.rs"

[dependencies]
nmeasim-core.workspace = true
nmeasim-sim.workspace = true
nmeasim-encode.workspace = true
nmeasim-transport.workspace = true
nmeasim-source.workspace = true
nmeasim-input.workspace = true
nmeasim-app.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
ureq.workspace = true
image.workspace = true
dirs.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "awesome-nmea"
maintainer = "Tom Leclercq <tomleclercq2006@gmail.com>"
copyright = "2026, nmeasim-rs contributors"
extended-description = """Simulateur de navire émettant NMEA 0183, AIS, Signal K et ViewSync \
sur TCP, UDP (diffusion, client, multicast), WebSocket et série. Pilotable au clavier, \
à la manette et par API HTTP. Compatible avec les configurations et journaux de NMEASimulator 1.6.1."""
section = "utils"
priority = "optional"
depends = "$auto, fonts-dejavu-core"
assets = [
    ["target/release/nmeasim", "usr/bin/", "755"],
    ["../../packaging/linux/nmeasim-rs.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/nmeasim-rs.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/nmeasim-rs/README.md", "644"],
]
