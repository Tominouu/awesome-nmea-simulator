name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fixtures:
    name: golden files intacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SHA-256 des captures legacy (P1 et P2)
        run: |
          (cd tests/fixtures/legacy && sha256sum -c SHA256SUMS)
          (cd tests/fixtures/legacy-p2 && sha256sum -c SHA256SUMS)

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dépendances système
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo test --workspace --all-targets

  core-deps:
    name: nmeasim-core sans dépendance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: seul std est autorisé (decisions/008)
        run: |
          deps=$(cargo tree -p nmeasim-core --edges normal --prefix none | sort -u | grep -v '^nmeasim-core ' || true)
          if [ -n "$deps" ]; then echo "dépendances interdites :"; echo "$deps"; exit 1; fi

  coverage:
    name: couverture 100 % (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p nmeasim-core --fail-under-lines 100 --show-missing-lines --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  package-linux:
    name: paquet .deb
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deb
      - run: cargo deb -p nmeasim
      - name: le binaire empaqueté démarre
        run: |
          mkdir root && dpkg -x target/debian/*.deb root
          root/usr/bin/nmeasim --version
          root/usr/bin/nmeasim --headless --start --duration 3 --print | head -24
      - uses: actions/upload-artifact@v4
        with:
          name: nmeasim-rs-deb
          path: target/debian/*.deb

  package-windows:
    name: archive Windows
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/windows/make-zip.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: nmeasim-rs-windows
          path: target/windows/*.zip

  package-macos:
    name: application macOS
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./packaging/macos/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nmeasim-rs-macos
          path: target/macos/*.dmg
