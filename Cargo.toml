[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"

[workspace.dependencies]
nmeasim-core = { path = "crates/core", features = ["serde"] }
nmeasim-sim = { path = "crates/sim" }
nmeasim-encode = { path = "crates/encode" }
nmeasim-transport = { path = "crates/transport" }
nmeasim-source = { path = "crates/source" }
nmeasim-input = { path = "crates/input" }
nmeasim-app = { path = "crates/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
roxmltree = "0.20"
tungstenite = "0.26"
socket2 = { version = "0.5", features = ["all"] }
serialport = "4"
if-addrs = "0.13"
tiny_http = "0.12"
gilrs = "0.11"
eframe = "0.31"
egui = "0.31"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
dirs = "6"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = "thin"
strip = true
